---
upgrade:
  - |
    Define C++ ``DType`` via builtins rather than fixed-width integer types.
    Any code that requires implementing all ``DTypes`` now needs to implement
    one additional type.
  - |
    Drop the ``signed`` prefix from some C++ ``FormatCharacter`` enum cases.
fixes:
  - |
    Ensure that C++ ``DType`` and ``DTypes`` support ``long`` and ``long long`` on all platforms.
    Previously it was only defined for fixed-width integer types, which means
    that one of ``int``, ``long``, or ``long long`` was left unsupported.

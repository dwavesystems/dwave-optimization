repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10  # must match dependency-groups.format in pyproject.toml
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3  # must match dependency-groups.format in pyproject.toml
    hooks:
      - id: clang-format
